name: ci

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            frontend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run verification pipeline
        working-directory: frontend
        run: npm run check

  deploy-preview:
    name: vercel preview deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - frontend
    if: (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.user.login == 'dotmantissa'))
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            frontend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel preview environment
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: vercel production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://stellarhyperion.vercel.app
    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            frontend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel production environment
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel (Production)
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - frontend
      - deploy-preview
      - deploy-production
    if: always()

    steps:
      - name: Verify all required checks passed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PREVIEW_RESULT: ${{ needs.deploy-preview.result }}
          PROD_RESULT: ${{ needs.deploy-production.result }}
        run: |
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Frontend CI failed with status: $FRONTEND_RESULT"
            exit 1
          fi
          if [ "$PREVIEW_RESULT" == "failure" ] || [ "$PREVIEW_RESULT" == "cancelled" ]; then
            echo "Vercel preview deployment failed with status: $PREVIEW_RESULT"
            exit 1
          fi
          if [ "$PROD_RESULT" == "failure" ] || [ "$PROD_RESULT" == "cancelled" ]; then
            echo "Vercel production deployment failed with status: $PROD_RESULT"
            exit 1
          fi
          echo "All frontend CI checks and deployments passed successfully."
