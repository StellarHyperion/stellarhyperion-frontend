name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  HYPERION_LIVE_ROUTES: "0"
  HYPERION_LIVE_TESTNET: "0"

jobs:
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  source-security:
    uses: ./.github/workflows/source-security.yml

  pr-description:
    uses: ./.github/workflows/pr-description.yml

  frontend:
    name: check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Restrict build network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Check out frontend repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run verification pipeline
        run: npm run check

  # The paused Vercel project has automatic Git deployments disabled in vercel.json.
  # Build, test, and contribution security remain required by this gate.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [frontend, supply-chain, source-security, pr-description]
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.frontend.result }}
          SECURITY_RESULT: ${{ needs.supply-chain.result }}
          SOURCE_SECURITY_RESULT: ${{ needs.source-security.result }}
          DESCRIPTION_RESULT: ${{ needs.pr-description.result }}
        run: test "$CHECK_RESULT" = success && test "$SECURITY_RESULT" = success && test "$SOURCE_SECURITY_RESULT" = success && test "$DESCRIPTION_RESULT" = success
