name: ci

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            frontend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run verification pipeline
        working-directory: frontend
        run: npm run check

  # Vercel's installed Git integration deploys main and reports its own deployment status.
  # Keep deployment credentials out of Actions and avoid duplicate production deployments.
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend]
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.frontend.result }}
        run: test "$CHECK_RESULT" = success
